# --- Directories ---
dir.source=D:\\LifePhoto_Before2007\\New Folder
dir.destination=.

# --- Run mode ---
# drymode=true    -> analyze and report only, touch nothing on disk
# filemove=true   -> move files; false -> copy files
run.mode.drymode=true
run.mode.filemove=false
# 0 = auto (all available cores)
run.parser.count=0

# Persist hashes so unchanged files are skipped on reruns (makes large runs resumable)
run.cache.enabled=true
run.cache.file=.phototidy-cache.tsv

# --- Policies ---
# noexif: SKIP | FIXED_DIR | MODIFIED_DATE | STOP
policy.noexif=MODIFIED_DATE
policy.noexif.dir=noExif
# duplicate (destination name collision): SKIP | INCREASE | OVERWRITE | STOP
policy.duplicate=INCREASE
# subfolder under dir.destination where near-duplicate images are filed
policy.duplicate.dir=duplicates

# --- Output layout (java.text.SimpleDateFormat patterns) ---
format.dir=yyyy\\yyyy_MM
format.file=yyyyMMdd_HHmmss
